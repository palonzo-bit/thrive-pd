<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THRIVE Facilitator Controls</title>
  <style>
    :root {
      --navy:#17324d; --blue:#2f6d8c; --teal:#4b9b94;
      --cream:#f7f3e8; --white:#fff; --dark:#263238; --red:#a12b2b;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--dark); font-family:Arial,Helvetica,sans-serif; }
    header { padding:25px 20px; color:white; text-align:center; background:linear-gradient(135deg,var(--navy),var(--blue)); }
    header h1 { margin:0; }
    main { width:min(760px,92%); margin:28px auto; }
    .card { padding:28px; background:white; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.1); }
    #progress { color:var(--blue); font-weight:bold; }
    #question { margin:14px 0 12px; color:var(--navy); font-size:1.8rem; line-height:1.3; }
    #responseCount { margin:0 0 24px; color:#5f6d73; font-weight:bold; }
    .controls { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    button {
      padding:17px; border:0; border-radius:10px; background:var(--teal);
      color:white; font-size:1rem; font-weight:bold; cursor:pointer;
    }
    button.secondary { background:var(--blue); }
    button.danger { background:var(--red); margin-top:14px; width:100%; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #status { min-height:24px; margin-top:16px; text-align:center; font-weight:bold; }
    .links { display:grid; gap:10px; margin-top:22px; }
    a { display:block; padding:12px; border-radius:9px; text-align:center; color:var(--blue); background:#eef4f7; font-weight:bold; text-decoration:none; }
    .note { margin-top:18px; color:#66747a; font-size:.9rem; line-height:1.4; }
  </style>
</head>
<body>
  <header><h1>THRIVE Facilitator Controls</h1></header>

  <main>
    <section class="card">
      <div id="progress">Connecting…</div>
      <h2 id="question">Loading current question…</h2>
      <p id="responseCount">0 responses</p>

      <div class="controls">
        <button class="secondary" id="previousButton">Previous Question</button>
        <button id="nextButton">Next Question</button>
      </div>

      <button class="danger" id="endButton">End / Reset Session</button>
      <div id="status" role="status" aria-live="polite"></div>

      <div class="links">
        <a href="response-wall.html" target="_blank">Open projected response wall</a>
        <a href="live-feedback.html" target="_blank">Open staff response page</a>
      </div>

      <p class="note">
        Keep this page private. Use the response wall on the projector and this page to move everyone together.
      </p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
      getDatabase, ref, onValue, set, query, orderByChild, equalTo
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDs81YP4w9BGQ50wFLmw1OY_8q8DllZwKE",
  authDomain: "thrive-pd-feedback.firebaseapp.com",
  databaseURL: "https://thrive-pd-feedback-default-rtdb.firebaseio.com",
  projectId: "thrive-pd-feedback",
  storageBucket: "thrive-pd-feedback.firebasestorage.app",
  messagingSenderId: "51558680904",
  appId: "1:51558680904:web:620bea08fb2d2174434b7d",
  measurementId: "G-N7YYL11E0J"
};
    const questions = [
  { id: "contributing-factors", text: "What were the greatest contributing factors?" },
  { id: "stressors", text: "What were the greatest stressors, aside from time?" },
  { id: "do-differently", text: "What would you do differently?" },
  { id: "worked-but-loose", text: "What worked well but felt loose?" },
  { id: "nonnegotiable", text: "What is nonnegotiable for next time?" }
];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const progress = document.getElementById("progress");
    const question = document.getElementById("question");
    const responseCount = document.getElementById("responseCount");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const endButton = document.getElementById("endButton");
    const status = document.getElementById("status");

    let currentQuestion = 0;
    let unsubscribeCount = null;

    function updateDisplay() {
      progress.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      question.textContent = questions[currentQuestion].text;
      previousButton.disabled = currentQuestion === 0;
      nextButton.disabled = currentQuestion === questions.length - 1;
      nextButton.textContent = currentQuestion === questions.length - 1 ? "Final Question" : "Next Question";

      if (unsubscribeCount) unsubscribeCount();
      const countQuery = query(
        ref(database, "liveResponses"),
        orderByChild("question"),
        equalTo(questions[currentQuestion].id)
      );
      unsubscribeCount = onValue(countQuery, (snapshot) => {
        responseCount.textContent = `${snapshot.size} response${snapshot.size === 1 ? "" : "s"} received`;
      });
    }

    async function setQuestion(number) {
      status.textContent = "Updating all screens…";
      try {
        await set(ref(database, "session/activeQuestion"), number);
        status.textContent = "All screens updated.";
        setTimeout(() => status.textContent = "", 1400);
      } catch (error) {
        console.error(error);
        status.textContent = "The question could not be changed.";
      }
    }

    previousButton.addEventListener("click", () => {
      if (currentQuestion > 0) setQuestion(currentQuestion - 1);
    });

    nextButton.addEventListener("click", () => {
      if (currentQuestion < questions.length - 1) setQuestion(currentQuestion + 1);
    });

    endButton.addEventListener("click", async () => {
      if (!confirm("End the session and place every screen in waiting mode?")) return;
      try {
        await set(ref(database, "session/activeQuestion"), null);
        status.textContent = "Session ended.";
      } catch (error) {
        console.error(error);
        status.textContent = "The session could not be ended.";
      }
    });

    async function start() {
      try {
        await signInAnonymously(auth);

        onValue(ref(database, "session/activeQuestion"), async (snapshot) => {
          const saved = snapshot.val();

          if (Number.isInteger(saved) && saved >= 0 && saved < questions.length) {
            currentQuestion = saved;
            updateDisplay();
          } else {
            currentQuestion = 0;
            await set(ref(database, "session/activeQuestion"), 0);
          }
        });
      } catch (error) {
        console.error(error);
        status.textContent = "Unable to connect.";
      }
    }

    start();
  </script>
</body>
</html>
