<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THRIVE Response Wall</title>
  <style>
    :root {
      --navy:#17324d; --blue:#2f6d8c; --teal:#4b9b94;
      --cream:#f7f3e8; --white:#fff; --dark:#263238;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--cream); color:var(--dark); font-family:Arial,Helvetica,sans-serif; }
    header {
      padding:26px 40px; color:white; text-align:center;
      background:linear-gradient(135deg,var(--navy),var(--blue));
      position:sticky; top:0; z-index:2;
    }
    header h1 { margin:0 0 8px; font-size:2.35rem; }
    #progress { font-weight:bold; opacity:.9; }
    #question { max-width:1100px; margin:15px auto 0; font-size:2rem; line-height:1.25; }
    #count { margin-top:12px; opacity:.9; }
    main { width:min(1500px,96%); margin:24px auto 45px; }
    #responses {
      display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px;
      align-items:start;
    }
    .response-card {
      padding:18px 20px; background:white; border-radius:14px;
      border-top:6px solid var(--teal); box-shadow:0 6px 18px rgba(0,0,0,.1);
      font-size:1.12rem; line-height:1.4; overflow-wrap:anywhere;
      animation:appear .3s ease;
    }
    .empty {
      grid-column:1/-1; padding:48px; background:white; border-radius:16px;
      text-align:center; font-size:1.35rem; color:#66747a;
    }
    @keyframes appear { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <header>
    <h1>THRIVE Cohort Reflection</h1>
    <div id="progress">Connecting…</div>
    <div id="question">Loading question…</div>
    <div id="count">0 responses</div>
  </header>

  <main>
    <div id="responses">
      <div class="empty">Responses will appear here as staff submit.</div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import {
      getDatabase, ref, onValue, query, orderByChild, equalTo
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDs81YP4w9BGQ50wFLmw1OY_8q8DllZwKE",
  authDomain: "thrive-pd-feedback.firebaseapp.com",
  databaseURL: "https://thrive-pd-feedback-default-rtdb.firebaseio.com",
  projectId: "thrive-pd-feedback",
  storageBucket: "thrive-pd-feedback.firebasestorage.app",
  messagingSenderId: "51558680904",
  appId: "1:51558680904:web:620bea08fb2d2174434b7d",
  measurementId: "G-N7YYL11E0J"
};
    const questions = [
  { id: "contributing-factors", text: "What were the greatest contributing factors?" },
  { id: "stressors", text: "What were the greatest stressors, aside from time?" },
  { id: "do-differently", text: "What would you do differently?" },
  { id: "worked-but-loose", text: "What worked well but felt loose?" },
  { id: "nonnegotiable", text: "What is nonnegotiable for next time?" }
];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const progress = document.getElementById("progress");
    const question = document.getElementById("question");
    const count = document.getElementById("count");
    const responses = document.getElementById("responses");

    let unsubscribeResponses = null;

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showResponses(snapshot) {
      const items = [];
      snapshot.forEach((child) => {
        const value = child.val();
        if (value?.answer) items.push(value);
      });

      items.sort((a, b) => (a.submittedAt || 0) - (b.submittedAt || 0));
      count.textContent = `${items.length} response${items.length === 1 ? "" : "s"}`;

      responses.innerHTML = items.length
        ? items.map(item => `<article class="response-card">${escapeHtml(item.answer)}</article>`).join("")
        : `<div class="empty">Responses will appear here as staff submit.</div>`;
    }

    function showWaiting() {
      if (unsubscribeResponses) {
        unsubscribeResponses();
        unsubscribeResponses = null;
      }
      progress.textContent = "Waiting to begin";
      question.textContent = "Waiting for the facilitator to begin.";
      count.textContent = "0 responses";
      responses.innerHTML = `<div class="empty">The live reflection has not started yet.</div>`;
    }

    async function start() {
      try {
        await signInAnonymously(auth);

        onValue(ref(database, "session/activeQuestion"), (snapshot) => {
          const questionNumber = snapshot.val();

          if (!Number.isInteger(questionNumber) || questionNumber < 0 || questionNumber >= questions.length) {
            showWaiting();
            return;
          }

          const active = questions[questionNumber];
          progress.textContent = `Question ${questionNumber + 1} of ${questions.length}`;
          question.textContent = active.text;

          if (unsubscribeResponses) unsubscribeResponses();

          const responsesQuery = query(
            ref(database, "liveResponses"),
            orderByChild("question"),
            equalTo(active.id)
          );

          unsubscribeResponses = onValue(responsesQuery, showResponses);
        });
      } catch (error) {
        console.error(error);
        progress.textContent = "Connection error";
        question.textContent = "Unable to connect to the live reflection.";
        responses.innerHTML = `<div class="empty">Refresh this page and try again.</div>`;
      }
    }

    start();
  </script>
</body>
</html>
