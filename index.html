<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Thrive PD Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8fb;
      color: #18324a;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 2.4rem;
    }

    .header p {
      margin-top: 0;
      font-size: 1.1rem;
      color: #52697d;
    }

    .question-card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    #question {
      margin-top: 0;
      font-size: 1.8rem;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 14px;
      border: 2px solid #cbd8e2;
      border-radius: 12px;
      font-size: 1rem;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #126fa3;
      color: white;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5b88;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
    }

    .responses-heading {
      margin-top: 36px;
      text-align: center;
    }

    #responses {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 16px;
      margin-top: 20px;
    }

    .response-card {
      background: white;
      border-left: 6px solid #14a9b8;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
      overflow-wrap: anywhere;
    }

    .response-card p {
      margin: 0;
      line-height: 1.5;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #65798a;
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="header">
      <h1>Together, We Thrive</h1>
      <p>Share your thinking with the team.</p>
    </header>

    <section class="question-card">
      <h2 id="question">
        What does thriving look like for our students?
      </h2>

      <form id="response-form">
        <label for="response">
          Type your response:
        </label>

        <textarea
          id="response"
          maxlength="300"
          placeholder="Share one idea..."
          required
        ></textarea>

        <button id="submit-button" type="submit">
          Submit Response
        </button>

        <div id="message" aria-live="polite"></div>
      </form>
    </section>

    <h2 class="responses-heading">Our Responses</h2>

    <section id="responses">
      <p class="empty-state">
        Responses will appear here.
      </p>
    </section>
  </main>

 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    "https://tyckvaiesbnwqaidluaf.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_YnOegLQ0WmVnTG2raweTmQ_V1xjQWm2";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const QUESTION_KEY = "thrive-opening";

  const form = document.getElementById("response-form");
  const responseBox = document.getElementById("response");
  const responsesContainer =
    document.getElementById("responses");
  const message = document.getElementById("message");
  const submitButton =
    document.getElementById("submit-button");

  function createResponseCard(response) {
    const card = document.createElement("article");
    card.className = "response-card";
    card.dataset.responseId = response.id;

    const paragraph = document.createElement("p");
    paragraph.textContent = response.response_text;

    card.appendChild(paragraph);

    return card;
  }

  function displayEmptyState() {
    responsesContainer.innerHTML = `
      <p class="empty-state">
        Responses will appear here.
      </p>
    `;
  }

  function addResponseToScreen(response) {
    const existingCard = document.querySelector(
      `[data-response-id="${response.id}"]`
    );

    if (existingCard) {
      return;
    }

    const emptyState =
      responsesContainer.querySelector(".empty-state");

    if (emptyState) {
      emptyState.remove();
    }

    const card = createResponseCard(response);
    responsesContainer.prepend(card);
  }

  async function loadResponses() {
    const { data, error } = await supabaseClient
      .from("responses")
      .select("id, response_text, created_at")
      .eq("question_key", QUESTION_KEY)
      .order("created_at", { ascending: false });

    if (error) {
      console.error("Unable to load responses:", error);
      displayEmptyState();
      return;
    }

    responsesContainer.innerHTML = "";

    if (!data || data.length === 0) {
      displayEmptyState();
      return;
    }

    data.forEach((response) => {
      responsesContainer.appendChild(
        createResponseCard(response)
      );
    });
  }

  async function submitResponse(event) {
    event.preventDefault();

    const responseText = responseBox.value.trim();

    if (!responseText) {
      message.textContent = "Please enter a response.";
      return;
    }

    submitButton.disabled = true;
    message.textContent = "Submitting...";

    const { error } = await supabaseClient
      .from("responses")
      .insert({
        response_text: responseText,
        question_key: QUESTION_KEY
      });

    if (error) {
      console.error("Unable to submit response:", error);
      message.textContent =
        "Your response could not be submitted. Please try again.";
      submitButton.disabled = false;
      return;
    }

    responseBox.value = "";
    message.textContent = "Your response was submitted.";
    submitButton.disabled = false;

    setTimeout(() => {
      message.textContent = "";
    }, 2500);
  }

  function subscribeToResponses() {
    supabaseClient
      .channel("live-thrive-responses")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "responses",
          filter: `question_key=eq.${QUESTION_KEY}`
        },
        (payload) => {
          addResponseToScreen(payload.new);
        }
      )
      .subscribe((status) => {
        console.log("Realtime status:", status);
      });
  }

  form.addEventListener("submit", submitResponse);

  loadResponses();
  subscribeToResponses();
</script>
</body>
</html>
